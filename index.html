<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILEDERE Enterprise ERP v6.0</title>
    <!-- Tailwind CSS for Professional UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f3f4f6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- القائمة الجانبية (Sidebar) -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl">
        <div class="p-6 text-2xl font-bold border-b border-slate-700 text-blue-400">ILEDERE ERP</div>
        <nav class="flex-1 mt-4 overflow-y-auto">
            <a href="#" onclick="showTab('pos')" class="nav-item flex items-center p-4 hover:bg-slate-800 transition active bg-blue-600"><i class="fas fa-file-invoice ml-3"></i> الفاتورة والمبيعات</a>
            <a href="#" onclick="showTab('inventory')" class="nav-item flex items-center p-4 hover:bg-slate-800 transition"><i class="fas fa-boxes ml-3"></i> إدارة المستودع</a>
            <a href="#" onclick="showTab('customers')" class="nav-item flex items-center p-4 hover:bg-slate-800 transition"><i class="fas fa-users ml-3"></i> دليل العملاء</a>
            <a href="#" onclick="showTab('commissions')" class="nav-item flex items-center p-4 hover:bg-slate-800 transition"><i class="fas fa-hand-holding-usd ml-3"></i> حساب العمولات</a>
            <a href="#" onclick="showTab('logs')" class="nav-item flex items-center p-4 hover:bg-slate-800 transition"><i class="fas fa-history ml-3"></i> سجل الحركات</a>
        </nav>
        <div class="p-4 border-t border-slate-700 text-xs text-slate-400 text-center">v6.0 - 2026 Edition</div>
    </aside>

    <!-- المنطقة الرئيسية -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- الرأس -->
        <header class="bg-white shadow-sm p-4 flex justify-between items-center px-8 border-b">
            <h2 id="tab-title" class="text-xl font-bold text-slate-700">نظام المبيعات والفواتير</h2>
            <div class="flex items-center gap-4">
                <span class="text-sm bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold">● متصل سحابياً</span>
                <span class="text-slate-500"><i class="fas fa-calendar-alt ml-1"></i> 2026-05-13</span>
            </div>
        </header>

        <!-- المحتوى -->
        <section class="p-8 overflow-y-auto flex-1">

            <!-- 1. الفواتير -->
            <div id="pos" class="tab-content active space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200 grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="flex flex-col"><label class="text-sm font-bold mb-1">العميل</label><select id="pos-cust" class="border p-2 rounded bg-gray-50 focus:ring-2 focus:ring-blue-500"></select></div>
                    <div class="flex flex-col"><label class="text-sm font-bold mb-1">المنتج (الباتش)</label><select id="pos-prod" class="border p-2 rounded bg-gray-50 focus:ring-2 focus:ring-blue-500"></select></div>
                    <div class="flex flex-col"><label class="text-sm font-bold mb-1">الكمية</label><input type="number" id="pos-qty" value="1" class="border p-2 rounded bg-gray-50"></div>
                    <div class="flex items-end"><button onclick="addToCart()" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">+ إضافة</button></div>
                </div>
                
                <div class="bg-white rounded-xl shadow-md border overflow-hidden">
                    <table class="w-full text-right">
                        <thead class="bg-slate-50 border-b">
                            <tr><th class="p-4">الصنف</th><th class="p-4 text-center">السعر</th><th class="p-4 text-center">الكمية</th><th class="p-4 text-center">الإجمالي</th><th class="p-4 text-center">إجراء</th></tr>
                        </thead>
                        <tbody id="cart-body"></tbody>
                    </table>
                    <div class="p-6 bg-slate-50 border-t flex flex-col items-end space-y-2">
                        <div class="text-lg">الإجمالي: <span id="sub-total" class="font-bold">0</span> ر.ق</div>
                        <div class="text-lg text-blue-600">صافي الفاتورة (بعد الخصم): <span id="final-total" class="text-3xl font-extrabold">0</span> ر.ق</div>
                        <button onclick="checkout()" class="bg-green-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-green-700 mt-4 shadow-lg">ترحيل الفاتورة وتحديث المخازن</button>
                    </div>
                </div>
            </div>

            <!-- 2. المستودع الشامل -->
            <div id="inventory" class="tab-content space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-md border grid grid-cols-1 md:grid-cols-5 gap-4">
                    <input type="hidden" id="edit-key">
                    <input type="text" id="p-name" placeholder="اسم المنتج" class="border p-2 rounded">
                    <input type="text" id="p-batch" placeholder="الباتش / التشغيلة" class="border p-2 rounded">
                    <input type="date" id="p-expiry" class="border p-2 rounded text-sm">
                    <input type="number" id="p-price" placeholder="سعر البيع" class="border p-2 rounded">
                    <input type="number" id="p-stock" placeholder="الرصيد الافتتاحي" class="border p-2 rounded">
                    <button onclick="saveProduct()" class="bg-slate-800 text-white font-bold py-2 rounded md:col-span-5 hover:bg-black transition">حفظ بيانات الصنف سحابياً</button>
                </div>
                <div class="bg-white rounded-xl shadow-md border">
                    <table class="w-full text-right">
                        <thead class="bg-slate-50">
                            <tr><th class="p-4">المنتج</th><th class="p-4">الباتش</th><th class="p-4">الانتهاء</th><th class="p-4">الرصيد</th><th class="p-4">السعر</th><th class="p-4 text-center">إجراء</th></tr>
                        </thead>
                        <tbody id="inv-table-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- 3. سجل الحركات العام -->
            <div id="logs" class="tab-content">
                <div class="bg-white rounded-xl shadow-md border overflow-hidden">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-slate-800 text-white">
                            <tr><th class="p-4">الوقت</th><th class="p-4">البيان</th><th class="p-4">المقدار</th><th class="p-4">الحالة</th></tr>
                        </thead>
                        <tbody id="log-table-body"></tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <script>
        const config = { databaseURL: "https://cosmetic-system-ad804-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(config);
        const db = firebase.database();

        let cart = [];
        let data = { products: {}, customers: {} };

        // التبديل بين التبويبات
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('bg-blue-600'));
            event.currentTarget.classList.add('bg-blue-600');
            document.getElementById('tab-title').innerText = event.currentTarget.innerText;
        }

        // مزامنة البيانات اللحظية
        db.ref('products').on('value', snap => {
            data.products = snap.val() || {};
            renderInventory();
            renderPOSOptions();
        });

        db.ref('customers').on('value', snap => {
            data.customers = snap.val() || {};
            renderCustomerOptions();
        });

        function renderPOSOptions() {
            const select = document.getElementById('pos-prod');
            select.innerHTML = '';
            Object.keys(data.products).forEach(k => {
                const p = data.products[k];
                select.innerHTML += `<option value="${k}">${p.name} (الباتش: ${p.batch} | المتوفر: ${p.stock})</option>`;
            });
        }

        function renderCustomerOptions() {
            const select = document.getElementById('pos-cust');
            select.innerHTML = '';
            Object.keys(data.customers).forEach(k => {
                const c = data.customers[k];
                select.innerHTML += `<option value="${k}">${c.name}</option>`;
            });
        }

        function renderInventory() {
            const body = document.getElementById('inv-table-body');
            body.innerHTML = '';
            Object.keys(data.products).forEach(k => {
                const p = data.products[k];
                body.innerHTML += `<tr class="border-b hover:bg-gray-50">
                    <td class="p-4 font-bold">${p.name}</td>
                    <td class="p-4">${p.batch}</td>
                    <td class="p-4">${p.expiry}</td>
                    <td class="p-4 text-blue-600 font-bold">${p.stock}</td>
                    <td class="p-4">${p.price}</td>
                    <td class="p-4 text-center">
                        <button onclick="editProd('${k}')" class="text-blue-600 ml-4"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteData('products/${k}')" class="text-red-600"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            });
        }

        // منطق المبيعات
        function addToCart() {
            const pk = document.getElementById('pos-prod').value;
            const qty = parseInt(document.getElementById('pos-qty').value);
            const p = data.products[pk];
            if(qty > p.stock) return alert("رصيد المستودع لا يكفي!");
            
            cart.push({ key: pk, name: p.name, price: p.price, qty: qty });
            renderCart();
        }

        function renderCart() {
            const body = document.getElementById('cart-body');
            let sub = 0; body.innerHTML = '';
            cart.forEach((i, idx) => {
                let total = i.price * i.qty; sub += total;
                body.innerHTML += `<tr class="border-b"><td class="p-4">${i.name}</td><td class="p-4 text-center">${i.price}</td><td class="p-4 text-center">${i.qty}</td><td class="p-4 text-center">${total}</td><td class="p-4 text-center"><button onclick="removeFromCart(${idx})" class="text-red-500">حذف</button></td></tr>`;
            });
            document.getElementById('sub-total').innerText = sub;
            document.getElementById('final-total').innerText = sub; // أضف منطق الخصم هنا لاحقاً
        }

        function checkout() {
            if(!cart.length) return;
            const time = new Date().toLocaleString('ar-QA');
            cart.forEach(item => {
                db.ref('products/' + item.key).update({ stock: data.products[item.key].stock - item.qty });
                db.ref('logs').push({ time, detail: `مبيعات: ${item.name}`, amount: item.qty, status: 'خارج' });
            });
            alert("تم الترحيل وتحديث الأرصدة");
            cart = []; renderCart();
        }

        // منطق المستودع
        function saveProduct() {
            const k = document.getElementById('edit-key').value;
            const pData = {
                name: document.getElementById('p-name').value,
                batch: document.getElementById('p-batch').value,
                expiry: document.getElementById('p-expiry').value,
                price: parseFloat(document.getElementById('p-price').value),
                stock: parseInt(document.getElementById('p-stock').value)
            };
            if(k) db.ref('products/'+k).update(pData); else db.ref('products').push(pData);
            clearInvForm();
        }

        function clearInvForm() {
            document.querySelectorAll('#inventory input').forEach(i => i.value = '');
            document.getElementById('edit-key').value = '';
        }

        // مزامنة السجل
        db.ref('logs').limitToLast(30).on('value', snap => {
            const body = document.getElementById('log-table-body');
            body.innerHTML = '';
            const logs = snap.val();
            if(logs) Object.keys(logs).reverse().forEach(k => {
                const l = logs[k];
                body.innerHTML += `<tr class="border-b">
                    <td class="p-4 text-slate-500">${l.time}</td>
                    <td class="p-4 font-bold">${l.detail}</td>
                    <td class="p-4">${l.amount}</td>
                    <td class="p-4"><span class="bg-red-100 text-red-600 px-2 py-1 rounded text-xs font-bold">${l.status}</span></td>
                </tr>`;
            });
        });

        function removeFromCart(i) { cart.splice(i, 1); renderCart(); }
        function deleteData(path) { if(confirm('هل تريد حذف هذا السجل نهائياً؟')) db.ref(path).remove(); }
    </script>
</body>
</html>
