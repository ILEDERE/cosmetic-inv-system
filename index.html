<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام ILEDERE المتكامل للمستودعات</title>
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #d81b60; --secondary: #1976d2; --success: #2e7d32; --dark: #2c3e50; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        
        /* التبويبات */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #e0e0e0; cursor: pointer; font-weight: bold; border-radius: 8px; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: white; }
        
        .content { display: none; }
        .content.active { display: block; }

        /* الجداول */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9em; }
        th { background: var(--dark); color: white; padding: 12px; sticky: top; }
        td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
        tr:hover { background: #f9f9f9; }
        .low-stock { color: white; background: #d32f2f !important; font-weight: bold; border-radius: 4px; }

        /* النماذج */
        .form-box { background: #f9f9f9; padding: 20px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 20px; }
        input, select { padding: 10px; margin: 5px; border: 1px solid #ccc; border-radius: 5px; width: 180px; }
        .btn-action { background: var(--secondary); color: white; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; }
        
        #conn-status { font-size: 0.8em; color: gray; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="conn-status">جاري التحقق من الاتصال بالسحابة...</div>
    <h2 style="color: var(--primary);">نظام إدارة المنتجات والعمولات - ILEDERE</h2>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('view')">📦 عرض المخزون</button>
        <button class="tab-btn" onclick="showTab('admin')">🛒 إدارة المبيعات والفواتير</button>
    </div>

    <!-- قسم العرض (للمناديب والمحاسب) -->
    <div id="view" class="content active">
        <table id="productsTable">
            <thead>
                <tr>
                    <th>المنتج</th>
                    <th>المخزن</th>
                    <th>السعر</th>
                    <th>عمولة البيع (5%)</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="inventoryBody">
                <!-- البيانات تظهر هنا تلقائياً -->
            </tbody>
        </table>
    </div>

    <!-- قسم الإدارة (للمحاسب فقط) -->
    <div id="admin" class="content">
        <div class="form-box">
            <h3>تسجيل حركة مخزنية</h3>
            <select id="prodSelect"></select>
            <input type="number" id="qtyInput" placeholder="الكمية">
            <select id="typeSelect">
                <option value="out">مبيعات (خصم من المخزن)</option>
                <option value="in">توريد (إضافة للمخزن)</option>
            </select>
            <button class="btn-action" onclick="handleTransaction()">تنفيذ الحفظ</button>
        </div>
        
        <!-- زر لرفع البيانات لأول مرة فقط -->
        <button onclick="seedInitialData()" style="font-size: 0.7em; opacity: 0.5;">(إعادة ضبط المنتجات الـ 40)</button>
    </div>
</div>

<script>
    // --- الربط بقاعدتك (Firebase Config) ---
    const firebaseConfig = {
        databaseURL: "https://cosmetic-system-ad804-default-rtdb.firebaseio.com/" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // فحص الاتصال
    db.ref('.info/connected').on('value', (snap) => {
        document.getElementById('conn-status').innerHTML = snap.val() ? "✅ متصل بالسحابة" : "❌ غير متصل";
    });

    // تبديل الأقسام
    function showTab(id) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // جلب البيانات وتحديث الجدول فوراً
    db.ref('products').on('value', (snapshot) => {
        const products = snapshot.val();
        const body = document.getElementById('inventoryBody');
        const select = document.getElementById('prodSelect');
        body.innerHTML = '';
        select.innerHTML = '';

        for (let key in products) {
            let p = products[key];
            let isLow = p.stock <= 5;
            
            body.innerHTML += `
                <tr>
                    <td><strong>${p.name}</strong></td>
                    <td class="${isLow ? 'low-stock' : ''}">${p.stock}</td>
                    <td>${p.selling_price} ريال</td>
                    <td style="color:green">${(p.selling_price * 0.05).toFixed(2)} ريال</td>
                    <td>${p.stock > 0 ? '✅ متوفر' : '❌ نفذ'}</td>
                </tr>
            `;
            select.innerHTML += `<option value="${key}">${p.name}</option>`;
        }
    });

    // تنفيذ عمليات البيع والشراء
    function handleTransaction() {
        const key = document.getElementById('prodSelect').value;
        const qty = parseInt(document.getElementById('qtyInput').value);
        const type = document.getElementById('typeSelect').value;

        if(!qty || qty <= 0) return alert('أدخل كمية صحيحة');

        db.ref('products/' + key).once('value').then(snap => {
            let currentStock = snap.val().stock;
            let newStock = (type === 'in') ? currentStock + qty : currentStock - qty;
            
            if(newStock < 0) return alert('عذراً، المخزون لا يكفي!');

            db.ref('products/' + key).update({ stock: newStock })
                .then(() => {
                    alert('تم الحفظ بنجاح');
                    document.getElementById('qtyInput').value = '';
                });
        });
    }

    // رفع الـ 40 منتج لأول مرة (تستخدمها مرة واحدة فقط)
    function seedInitialData() {
        if(!confirm('سيتم إعادة ضبط جميع الكميات، هل أنت متأكد؟')) return;
        const data = {
            "p1": { "name": "كريم نهار مرطب", "stock": 45, "selling_price": 100 },
            "p2": { "name": "سيروم الهيالورونيك", "stock": 12, "selling_price": 210 },
            "p3": { "name": "واقي شمس +50", "stock": 3, "selling_price": 95 },
            "p4": { "name": "غسول للبشرة الدهنية", "stock": 60, "selling_price": 75 },
            "p5": { "name": "زيت الأرغان للشعر", "stock": 25, "selling_price": 140 }
            // يمكنك تكملة الـ 40 هنا بنفس النمط
        };
        db.ref('products').set(data);
    }
</script>

</body>
</html>
