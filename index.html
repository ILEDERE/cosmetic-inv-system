<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام ILEDERE المتكامل - محاسبة ومستودعات</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #d81b60; --secondary: #1976d2; --success: #2e7d32; --dark: #2c3e50; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; }
        #conn-status { font-size: 0.85em; padding: 5px 10px; border-radius: 20px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #ddd; cursor: pointer; font-weight: bold; border-radius: 6px; }
        .tab-btn.active { background: var(--primary); color: white; }
        .content { display: none; }
        .content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th { background: var(--dark); color: white; padding: 12px; font-size: 0.9em; }
        td { padding: 10px; border: 1px solid #eee; text-align: center; font-size: 0.9em; }
        .out-move { color: #d32f2f; font-weight: bold; } /* مبيعات - أحمر */
        .in-move { color: #2e7d32; font-weight: bold; }  /* توريد - أخضر */
        .admin-panel { background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-top: 20px; }
        .input-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 150px; }
        .btn-save { background: var(--success); color: white; border: none; padding: 10px 30px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0; color: var(--primary);">ILEDERE ERP - السجل المحاسبي</h2>
        <div id="conn-status" style="background: #eee;">جاري الاتصال...</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('view')">📦 المستودع</button>
        <button class="tab-btn" onclick="showTab('admin')">⚙️ الإدارة والعمليات</button>
        <button class="tab-btn" onclick="showTab('history')">📜 سجل الحركات</button>
    </div>

    <!-- واجهة المستودع -->
    <div id="view" class="content active">
        <table id="productsTable">
            <thead>
                <tr>
                    <th>المنتج</th>
                    <th>المخزن</th>
                    <th>السعر</th>
                    <th>عمولة البيع (5%)</th>
                </tr>
            </thead>
            <tbody id="inventoryBody"></tbody>
        </table>
    </div>

    <!-- واجهة الإدارة -->
    <div id="admin" class="content">
        <div class="admin-panel">
            <h3>تسجيل حركة جديدة</h3>
            <div class="input-group">
                <select id="prodSelect"></select>
                <input type="number" id="qtyInput" placeholder="الكمية">
                <select id="typeSelect">
                    <option value="out">مبيعات (إخراج من المستودع)</option>
                    <option value="in">توريد (إدخال للمستودع)</option>
                </select>
                <button class="btn-save" onclick="handleTransaction()">تنفيذ وحفظ العملية</button>
            </div>
        </div>
        <div style="margin-top: 20px; text-align: center; opacity: 0.5;">
            <button onclick="seedInitialData()">إعادة ضبط الـ 40 منتجاً</button>
        </div>
    </div>

    <!-- واجهة سجل الحركات (المرجع) -->
    <div id="history" class="content">
        <h3>سجل العمليات التاريخي</h3>
        <table>
            <thead>
                <tr>
                    <th>التاريخ والوقت</th>
                    <th>المنتج</th>
                    <th>النوع</th>
                    <th>الكمية</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://cosmetic-system-ad804-default-rtdb.firebaseio.com/" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // فحص الاتصال
    db.ref('.info/connected').on('value', (snap) => {
        const status = document.getElementById('conn-status');
        status.innerHTML = snap.val() ? "✅ سحابي متصل" : "❌ انقطع الاتصال";
        status.style.background = snap.val() ? "#e8f5e9" : "#ffebee";
    });

    function showTab(id) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // تحديث المخزن والمنتجات
    db.ref('products').on('value', (snapshot) => {
        const products = snapshot.val();
        const body = document.getElementById('inventoryBody');
        const select = document.getElementById('prodSelect');
        body.innerHTML = ''; select.innerHTML = '';
        for (let key in products) {
            let p = products[key];
            body.innerHTML += `<tr><td>${p.name}</td><td>${p.stock}</td><td>${p.selling_price} ريال</td><td>${(p.selling_price * 0.05).toFixed(2)} ريال</td></tr>`;
            select.innerHTML += `<option value="${key}">${p.name}</option>`;
        }
    });

    // جلب السجل التاريخي (آخر 50 عملية)
    db.ref('history').limitToLast(50).on('value', (snapshot) => {
        const historyBody = document.getElementById('historyBody');
        historyBody.innerHTML = '';
        const data = snapshot.val();
        if (data) {
            // ترتيب الحركات من الأحدث للأقدم
            Object.keys(data).reverse().forEach(key => {
                const h = data[key];
                const typeText = h.type === 'out' ? 'إخراج (بيع)' : 'إدخال (توريد)';
                const typeClass = h.type === 'out' ? 'out-move' : 'in-move';
                historyBody.innerHTML += `
                    <tr>
                        <td>${h.timestamp}</td>
                        <td>${h.productName}</td>
                        <td class="${typeClass}">${typeText}</td>
                        <td>${h.quantity}</td>
                        <td>✅ مكتملة</td>
                    </tr>`;
            });
        }
    });

    function handleTransaction() {
        const key = document.getElementById('prodSelect').value;
        const qty = parseInt(document.getElementById('qtyInput').value);
        const type = document.getElementById('typeSelect').value;
        const prodName = document.getElementById('prodSelect').options[document.getElementById('prodSelect').selectedIndex].text;

        if(!qty || qty <= 0) return alert('أدخل كمية صحيحة');

        db.ref('products/' + key).once('value').then(snap => {
            const currentStock = snap.val().stock;
            const newStock = (type === 'in') ? currentStock + qty : currentStock - qty;
            if(newStock < 0) return alert('المخزون غير كافٍ!');

            // 1. تحديث المخزن
            db.ref('products/' + key).update({ stock: newStock }).then(() => {
                // 2. تسجيل العملية في السجل (History)
                const logEntry = {
                    productName: prodName,
                    quantity: qty,
                    type: type,
                    timestamp: new Date().toLocaleString('ar-QA')
                };
                db.ref('history').push(logEntry);
                
                alert('تم حفظ العملية وتوثيقها في السجل');
                document.getElementById('qtyInput').value = '';
            });
        });
    }

    function seedInitialData() {
        if(!confirm('ضبط المصنع سيمسح المخزن الحالي، استمرار؟')) return;
        const initialData = {};
        for(let i=1; i<=40; i++) {
            initialData['p'+i] = { "name": "منتج تجميلي " + i, "stock": 100, "selling_price": (50 + i) };
        }
        db.ref('products').set(initialData);
    }
</script>
</body>
</html>
