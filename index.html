<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام ILEDERE PRO - الإدارة الشاملة</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #d81b60; --secondary: #1976d2; --success: #2e7d32; --dark: #2c3e50; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; }
        #conn-status { font-size: 0.85em; padding: 5px 10px; border-radius: 20px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; }
        .tab-btn { flex: 1; min-width: 100px; padding: 12px; border: none; background: #ddd; cursor: pointer; font-weight: bold; border-radius: 6px; }
        .tab-btn.active { background: var(--primary); color: white; }
        .content { display: none; }
        .content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th { background: var(--dark); color: white; padding: 12px; font-size: 0.9em; }
        td { padding: 10px; border: 1px solid #eee; text-align: center; font-size: 0.9em; }
        .form-box { background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; }
        .input-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 120px; }
        .btn { border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
        .btn-add { background: var(--success); }
        .btn-edit { background: var(--secondary); font-size: 0.8em; }
        .btn-del { background: #d32f2f; font-size: 0.8em; }
        .summary-bar { background: var(--dark); color: white; padding: 15px; border-radius: 8px; margin-top: 20px; display: flex; justify-content: space-around; flex-wrap: wrap; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0; color: var(--primary);">ILEDERE PRO</h2>
        <div id="conn-status">جاري الاتصال...</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('view')">📦 المخزن</button>
        <button class="tab-btn" onclick="showTab('admin')">🛒 حركة مبيعات</button>
        <button class="tab-btn" onclick="showTab('setup')">🛠️ إدارة المنتجات</button>
        <button class="tab-btn" onclick="showTab('history')">📜 السجل</button>
    </div>

    <!-- المخزن -->
    <div id="view" class="content active">
        <table id="productsTable">
            <thead>
                <tr>
                    <th>المنتج</th>
                    <th>المخزن</th>
                    <th>السعر</th>
                    <th>القيمة الإجمالية</th>
                </tr>
            </thead>
            <tbody id="inventoryBody"></tbody>
        </table>
        <div class="summary-bar" id="summaryBar">
            <span>إجمالي قطع المخزن: <b id="totalQty">0</b></span>
            <span>إجمالي قيمة العهدة: <b id="totalValue">0</b> ريال</span>
        </div>
    </div>

    <!-- المبيعات -->
    <div id="admin" class="content">
        <div class="form-box">
            <h3>تسجيل مبيعات / توريد</h3>
            <div class="input-group">
                <select id="prodSelectAdmin"></select>
                <input type="number" id="qtyInput" placeholder="الكمية">
                <select id="typeSelect">
                    <option value="out">مبيعات (خصم)</option>
                    <option value="in">توريد (إضافة)</option>
                </select>
                <button class="btn btn-add" onclick="handleTransaction()">حفظ العملية</button>
            </div>
        </div>
    </div>

    <!-- إدارة المنتجات (الطلب الجديد) -->
    <div id="setup" class="content">
        <div class="form-box">
            <h3>➕ إضافة منتج جديد للقائمة</h3>
            <div class="input-group">
                <input type="text" id="newName" placeholder="اسم المنتج">
                <input type="number" id="newStock" placeholder="الكمية الافتتاحية">
                <input type="number" id="newPrice" placeholder="السعر">
                <button class="btn btn-add" onclick="addNewProduct()">إضافة للمنظومة</button>
            </div>
        </div>
        <h3>📝 تعديل أو حذف المنتجات الحالية</h3>
        <table id="setupTable">
            <thead>
                <tr>
                    <th>اسم المنتج</th>
                    <th>السعر</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="setupBody"></tbody>
        </table>
    </div>

    <!-- السجل -->
    <div id="history" class="content">
        <table id="historyTable">
            <thead>
                <tr>
                    <th>الوقت</th>
                    <th>المنتج</th>
                    <th>النوع</th>
                    <th>الكمية</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://cosmetic-system-ad804-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('.info/connected').on('value', snap => {
        const s = document.getElementById('conn-status');
        s.innerHTML = snap.val() ? "✅ متصل" : "❌ منقطع";
        s.style.background = snap.val() ? "#e8f5e9" : "#ffebee";
    });

    function showTab(id) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // تحديث البيانات الشامل
    db.ref('products').on('value', snapshot => {
        const products = snapshot.val();
        const invBody = document.getElementById('inventoryBody');
        const setupBody = document.getElementById('setupBody');
        const selAdmin = document.getElementById('prodSelectAdmin');
        
        invBody.innerHTML = ''; setupBody.innerHTML = ''; selAdmin.innerHTML = '';
        let totalQ = 0, totalV = 0;

        for (let key in products) {
            let p = products[key];
            let rowVal = p.stock * p.selling_price;
            totalQ += parseInt(p.stock);
            totalV += rowVal;

            invBody.innerHTML += `<tr><td>${p.name}</td><td>${p.stock}</td><td>${p.selling_price}</td><td>${rowVal}</td></tr>`;
            setupBody.innerHTML += `<tr>
                <td>${p.name}</td>
                <td>${p.selling_price}</td>
                <td>
                    <button class="btn btn-edit" onclick="editProduct('${key}', '${p.name}', ${p.selling_price})">تعديل</button>
                    <button class="btn btn-del" onclick="deleteProduct('${key}')">حذف</button>
                </td>
            </tr>`;
            selAdmin.innerHTML += `<option value="${key}">${p.name}</option>`;
        }
        document.getElementById('totalQty').innerText = totalQ;
        document.getElementById('totalValue').innerText = totalV.toLocaleString();
    });

    // إضافة منتج جديد
    function addNewProduct() {
        const name = document.getElementById('newName').value;
        const stock = parseInt(document.getElementById('newStock').value);
        const price = parseInt(document.getElementById('newPrice').value);
        if(!name || isNaN(stock) || isNaN(price)) return alert('أكمل البيانات');
        
        db.ref('products').push({ name, stock, selling_price: price })
          .then(() => { alert('تمت الإضافة'); document.querySelectorAll('#setup input').forEach(i=>i.value=''); });
    }

    // حذف منتج
    function deleteProduct(key) {
        if(confirm('هل أنت متأكد من حذف المنتج نهائياً؟')) db.ref('products/' + key).remove();
    }

    // تعديل منتج
    function editProduct(key, oldName, oldPrice) {
        const newName = prompt('اسم المنتج الجديد:', oldName);
        const newPrice = prompt('السعر الجديد:', oldPrice);
        if(newName && newPrice) {
            db.ref('products/' + key).update({ name: newName, selling_price: parseInt(newPrice) });
        }
    }

    // المبيعات والسجل
    function handleTransaction() {
        const key = document.getElementById('prodSelectAdmin').value;
        const qty = parseInt(document.getElementById('qtyInput').value);
        const type = document.getElementById('typeSelect').value;
        const name = document.getElementById('prodSelectAdmin').options[document.getElementById('prodSelectAdmin').selectedIndex].text;

        db.ref('products/' + key).once('value', snap => {
            const newStock = type === 'in' ? snap.val().stock + qty : snap.val().stock - qty;
            if(newStock < 0) return alert('المخزون لا يكفي');
            
            db.ref('products/' + key).update({ stock: newStock });
            db.ref('history').push({ productName: name, quantity: qty, type, timestamp: new Date().toLocaleString('ar-QA') });
            alert('تم الحفظ');
        });
    }

    db.ref('history').limitToLast(20).on('value', snap => {
        const body = document.getElementById('historyBody');
        body.innerHTML = '';
        const data = snap.val();
        if(data) Object.keys(data).reverse().forEach(k => {
            const h = data[k];
            body.innerHTML += `<tr><td>${h.timestamp}</td><td>${h.productName}</td><td>${h.type==='out'?'خصم':'إضافة'}</td><td>${h.quantity}</td></tr>`;
        });
    });
</script>
</body>
</html>
