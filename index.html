<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة مستحضرات التجميل</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #d81b60; color: white; }
        .low-stock { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h2>لوحة تحكم المخازن والعمولات</h2>
    <table>
        <thead>
            <tr>
                <th>المنتج</th>
                <th>المخزون</th>
                <th>سعر البيع</th>
                <th>عمولة المبيعات</th>
                <th>الحالة</th>
            </tr>
        </thead>
        <tbody id="product-table">
            <!-- البيانات ستظهر هنا -->
        </tbody>
    </table>

   <script>
        // دالة لجلب البيانات وعرضها في الجدول
        async function loadProducts() {
            try {
                const response = await fetch('products.json');
                if (!response.ok) throw new Error('تعذر تحميل الملف');
                
                const data = await response.json();
                const tableBody = document.getElementById('product-table');
                tableBody.innerHTML = ''; 

                data.forEach(product => {
                    const commission = (product.selling_price * product.personal_sale_commission).toFixed(2);
                    const row = `
                        <tr>
                            <td>${product.name}</td>
                            <td style="color: ${product.stock < product.min_limit ? 'red' : 'black'}; font-weight: bold;">
                                ${product.stock}
                            </td>
                            <td>${product.selling_price} ريال</td>
                            <td>${commission} ريال</td>
                            <td>${product.stock > 0 ? 'متوفر' : 'نفذت الكمية'}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error('خطأ في النظام:', error);
            }
        }

        // تشغيل الدالة فور تحميل الصفحة
        window.onload = loadProducts;
    </script>
</body>
</html>
